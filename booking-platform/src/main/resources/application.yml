spring:
  application:
    name: booking-platform
  
  # Perfil activo por defecto
  profiles:
    active: dev
    
  # Configuración de base de datos
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_platform
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      
  # Configuración JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: validate # Importante: usamos Flyway para migraciones, no generación auto de esquema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    show-sql: false
  
  # Configuración de Flyway para migraciones
  flyway:
    enabled: true
    schemas: public
    baseline-on-migrate: true
    
  # Configuración de seguridad  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-example.us.auth0.com/ # Cambiar por tu Auth0 domain
          
# Configuración de servidor
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
    
# Configuración de actuator para health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      
# Configuración OpenAPI (Swagger)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    
# Configuración de logging
logging:
  level:
    root: INFO
    com.bookingsaas: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    
# Configuración de la aplicación
app:
  security:
    jwt:
      secret: ${JWT_SECRET:your-strong-jwt-secret-key-here-min-32-chars}
      expirationMs: 86400000 # 24 horas
  multitenancy:
    defaultSchema: public
    tenantHeaderName: X-Tenant-ID